<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Expense</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <div>
                <h1>My Expense</h1>
                <p>Track your money, simply.</p>
            </div>

            <div class="logo">💜</div>
        </header>


        <!-- SUMMARY -->
        <div class="summary">

            <div class="summary-card">
                <div class="summary-icon">💰</div>

                <div>
                    <p>Total Expenses</p>
                    <h2 id="totalExpenses">₹0</h2>
                </div>
            </div>


            <div class="summary-card">
                <div class="summary-icon">📅</div>

                <div>
                    <p>This Month</p>
                    <h2 id="monthExpenses">₹0</h2>
                </div>
            </div>


            <div class="summary-card">
                <div class="summary-icon">🧾</div>

                <div>
                    <p>Transactions</p>
                    <h2 id="totalTransactions">0</h2>
                </div>
            </div>

        </div>


        <!-- ADD EXPENSE -->
        <section class="card">

            <div class="title">
                <h2>Add Expense</h2>
                <p>Record your spending</p>
            </div>


            <form id="expenseForm">

                <div class="form-grid">

                    <div class="field">
                        <label>Amount</label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="Enter amount"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>


                    <div class="field">
                        <label>Category</label>

                        <select id="category" required>

                            <option value="">Select category</option>

                            <option value="Food">🍔 Food</option>

                            <option value="Travel">✈️ Travel</option>

                            <option value="Shopping">🛍️ Shopping</option>

                            <option value="Bills">💡 Bills</option>

                            <option value="Education">📚 Education</option>

                            <option value="Entertainment">🎬 Entertainment</option>

                            <option value="Other">📌 Other</option>

                        </select>

                    </div>


                    <div class="field">

                        <label>Date</label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>Description</label>

                        <input
                            type="text"
                            id="description"
                            placeholder="Example: Lunch"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="add-button"
                    id="submitButton"
                >
                    + Add Expense
                </button>

            </form>

        </section>


        <!-- EXPENSE LIST -->
        <section class="card">

            <div class="title-row">

                <div class="title">
                    <h2>Recent Expenses</h2>
                    <p>Your latest transactions</p>
                </div>

                <span id="expenseBadge" class="badge">0</span>

            </div>


            <div class="filters">

                <div class="search">

                    <span>🔍</span>

                    <input
                        type="text"
                        id="search"
                        placeholder="Search expenses..."
                    >

                </div>


                <select id="categoryFilter">

                    <option value="All">All Categories</option>

                    <option value="Food">Food</option>

                    <option value="Travel">Travel</option>

                    <option value="Shopping">Shopping</option>

                    <option value="Bills">Bills</option>

                    <option value="Education">Education</option>

                    <option value="Entertainment">Entertainment</option>

                    <option value="Other">Other</option>

                </select>

            </div>


            <div id="expenseList"></div>

        </section>


        <!-- CHART -->
        <section class="card">

            <div class="title-row">

                <div class="title">
                    <h2>Expense Overview</h2>
                    <p>See where your money goes</p>
                </div>


                <select id="chartType">

                    <option value="doughnut">Donut Chart</option>

                    <option value="pie">Pie Chart</option>

                    <option value="bar">Bar Chart</option>

                </select>

            </div>


            <div class="chart-box">

                <canvas id="expenseChart"></canvas>

            </div>

        </section>


        <footer>
            My Expense • Simple. Smart. Organized. 💜
        </footer>

    </div>


    <!-- IMPORTANT: JavaScript is loaded last -->
    <script src="script.js"></script>

</body>
</html>
